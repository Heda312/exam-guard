# ExamGuard — production stack.
#
#   cp .env.example .env      # isi variabel, lalu:
#   docker compose up -d --build
#
# Semua langkah lain otomatis: menunggu database, `alembic upgrade head`,
# membuat administrator awal, lalu menjalankan API + nginx.
# Port host diatur oleh WEB_PORT (default 9200) — arahkan Cloudflare Tunnel
# ke http://127.0.0.1:${WEB_PORT}.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examguard}
      POSTGRES_USER: ${POSTGRES_USER:-examguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examguard} -d ${POSTGRES_DB:-examguard}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [examguard]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      # --- database ---
      # Override DATABASE_URL explicitly when POSTGRES_PASSWORD contains
      # characters that are unsafe in a URL (for example @, / or ?); the value
      # must be URL-encoded in that case.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-examguard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-examguard}}
      # Migrasi dijalankan oleh entrypoint, jadi tabel tidak dibuat otomatis.
      AUTO_CREATE_TABLES: "false"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      # --- secrets ---
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY wajib diisi di .env}
      SETUP_SECRET: ${SETUP_SECRET:-}
      SETUP_DISABLED: ${SETUP_DISABLED:-true}
      # --- unattended admin bootstrap ---
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-heda}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-WedhusGembel5}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      # --- public origin / cookies ---
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL wajib diisi di .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PUBLIC_BASE_URL}}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      # --- participant identity ---
      PARTICIPANT_IDENTITY_MODE: ${PARTICIPANT_IDENTITY_MODE:-none}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      # --- exam / monitoring ---
      ALLOWED_EXAM_URL_HOSTS: ${ALLOWED_EXAM_URL_HOSTS:-docs.google.com,forms.gle,forms.google.com}
      COMMITMENT_VERSION: ${COMMITMENT_VERSION:-exam-integrity-v1}
      HEARTBEAT_INTERVAL_SECONDS: ${HEARTBEAT_INTERVAL_SECONDS:-10}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-45}
      INCIDENT_CORRELATION_MS: ${INCIDENT_CORRELATION_MS:-400}
      EXPIRY_SWEEP_SECONDS: ${EXPIRY_SWEEP_SECONDS:-5}
      # --- rate limits ---
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
      REGISTER_RATE_LIMIT_PER_MINUTE: ${REGISTER_RATE_LIMIT_PER_MINUTE:-20}
      # --- runtime ---
      API_PORT: ${API_PORT:-8000}
      API_WORKERS: ${API_WORKERS:-1}
    expose:
      - "${API_PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${API_PORT:-8000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks: [examguard]

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
      args:
        API_PORT: ${API_PORT:-8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Host port only. Point your Cloudflare Tunnel at http://127.0.0.1:${WEB_PORT}.
      - "${WEB_PORT:-9200}:80"
    environment:
      # nginx resolves the API service and port at start-up.
      API_HOST: api
      API_PORT: ${API_PORT:-8000}
    networks: [examguard]

volumes:
  db_data:

networks:
  examguard:
    driver: bridge
